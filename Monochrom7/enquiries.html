</header><main><section class="hero"><h1>Model Enquiry</h1><p class="subtitle">Interested in becoming part of Monochrome?</p><hr class="divider"></section>
<form class="form-container" id="model-application-form"><div class="form-group"><label for="name">Full Name</label><input id="name" type="text" name="name" autocomplete="name" required></div>
<div class="form-group"><label for="email">Email Address</label><input id="email" type="email" name="email" autocomplete="email" required></div>
<div class="form-group"><label for="phone">Phone Number</label><input id="phone" type="tel" name="phone" autocomplete="tel"></div>
<div class="form-group"><label for="age">Age</label><input id="age" type="number" name="age" min="16" max="100" required></div>
<div class="form-group"><label for="model-type">Modelling interest</label><select id="model-type" name="modelType" required><option value="">Choose a category</option><option>Fashion / Editorial</option><option>Commercial / Lifestyle</option><option>Runway</option><option>Beauty</option><option>New to modelling</option></select></div>
<div class="form-group"><label for="reason">Tell us about yourself</label><textarea id="reason" name="reason" rows="6" placeholder="Tell us about your experience, interests and the type of modelling you are interested in."></textarea></div>
